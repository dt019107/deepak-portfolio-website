<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0F111A"/>
  <!-- Left Source Connectors -->
  <g transform="translate(20, 20)">
    <rect width="210" height="410" rx="10" fill="#161926" stroke="#252A3D" stroke-width="1"/>
    <text x="16" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">CONNECTED CORPORA</text>
    
    <g transform="translate(16, 50)">
      <rect width="178" height="42" rx="6" fill="#0F111A" stroke="#252A3D" stroke-width="1"/>
      <text x="12" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">📄 Notion Knowledgebase</text>
    </g>
    <g transform="translate(16, 100)">
      <rect width="178" height="42" rx="6" fill="#0F111A" stroke="#252A3D" stroke-width="1"/>
      <text x="12" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">🐙 GitHub Architecture PRs</text>
    </g>
    <g transform="translate(16, 150)">
      <rect width="178" height="42" rx="6" fill="#0F111A" stroke="#252A3D" stroke-width="1"/>
      <text x="12" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">🎫 Jira Epics &amp; Specs</text>
    </g>

    <rect x="16" y="340" width="178" height="50" rx="6" fill="#1E2337"/>
    <text x="26" y="362" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">EMBEDDED TOKENS</text>
    <text x="26" y="380" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#A78BFA">42.8M VECTORS</text>
  </g>

  <!-- Center-Right Copilot Chat & Reasoning -->
  <g transform="translate(250, 20)">
    <rect width="530" height="410" rx="10" fill="#161926" stroke="#252A3D" stroke-width="1"/>
    
    <!-- User Prompt Bubble -->
    <g transform="translate(20, 20)">
      <rect width="490" height="50" rx="8" fill="#1E2337" stroke="#3B82F6" stroke-width="1"/>
      <text x="16" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#FFFFFF">"Summarize the zero-build design token cascade and contrast enforcement rule."</text>
    </g>

    <!-- AI Reasoning Stream -->
    <g transform="translate(20, 85)">
      <rect width="490" height="230" rx="8" fill="#0F111A" stroke="#252A3D" stroke-width="1"/>
      <text x="16" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#A78BFA">✨ SYNAPSE GROUNDED RESPONSE (4 SOURCES CITED)</text>
      
      <text x="16" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#E2E8F0">Based on the TriLayer design system specs (PR #104 &amp; tokens.css):</text>
      
      <text x="16" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">1. <tspan fill="#FFFFFF" font-weight="bold">3-Tier Cascade:</tspan> Raw Primitives → Contextual Semantics → Component Bindings.</text>
      <text x="16" y="102" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">2. <tspan fill="#FFFFFF" font-weight="bold">WCAG AAA Compliance:</tspan> Contrast threshold >= 7:1 for headers, 4.5:1 for body.</text>
      <text x="16" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">3. <tspan fill="#FFFFFF" font-weight="bold">Zero-Build Runtime:</tspan> Native CSS variables sync directly with Figma variables.</text>

      <!-- Citation chips -->
      <g transform="translate(16, 165)">
        <rect width="130" height="24" rx="4" fill="#1E2337"/>
        <text x="65" y="16" font-family="system-ui, sans-serif" font-size="9" fill="#38BDF8" text-anchor="middle">🔗 doc/tokens.md:L42</text>
        <rect x="140" width="130" height="24" rx="4" fill="#1E2337"/>
        <text x="205" y="16" font-family="system-ui, sans-serif" font-size="9" fill="#38BDF8" text-anchor="middle">🔗 figma/primitives.json</text>
      </g>
    </g>

    <!-- Prompt Input bar -->
    <g transform="translate(20, 335)">
      <rect width="490" height="52" rx="8" fill="#1E2337" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="20" y="31" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Ask Synapse anything across engineering &amp; design...</text>
      <rect x="420" y="10" width="58" height="32" rx="6" fill="#3B82F6"/>
      <text x="449" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Send</text>
    </g>
  </g>
</svg>