<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#medGrad)"/>

  <!-- Left Patient Card -->
  <g transform="translate(20, 20)">
    <rect width="230" height="410" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <!-- Patient Profile -->
    <circle cx="50" cy="50" r="26" fill="#3B82F6"/>
    <text x="50" y="56" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SJ</text>
    <text x="88" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Sarah Jenkins</text>
    <text x="88" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Age 38 • Female • OPD-4109</text>
    <rect x="20" y="90" width="190" height="24" rx="12" fill="#047857" opacity="0.3"/>
    <text x="115" y="106" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34D399" text-anchor="middle">● TRIAGE: STABLE / MONITORED</text>

    <!-- Bio Metric Cards -->
    <rect x="20" y="130" width="190" height="65" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="32" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">HEART RATE</text>
    <text x="32" y="180" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#F43F5E">74 <tspan font-size="12" fill="#94A3B8">BPM</tspan></text>
    <path d="M 120 170 L 135 170 L 140 150 L 145 185 L 150 160 L 155 170 L 195 170" fill="none" stroke="#F43F5E" stroke-width="2"/>

    <rect x="20" y="205" width="190" height="65" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="32" y="227" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">BLOOD OXYGEN (SpO2)</text>
    <text x="32" y="255" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#06B6D4">98.5%</text>
    <circle cx="160" cy="238" r="16" fill="none" stroke="#06B6D4" stroke-width="3" stroke-dasharray="75,25"/>

    <rect x="20" y="280" width="190" height="65" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="32" y="302" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">BLOOD PRESSURE</text>
    <text x="32" y="330" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#3B82F6">118/76 <tspan font-size="12" fill="#94A3B8">mmHg</tspan></text>

    <rect x="20" y="358" width="190" height="36" rx="6" fill="#3B82F6"/>
    <text x="115" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Issue Prescription E-Sign</text>
  </g>

  <!-- Main Video / Consultation Pane -->
  <g transform="translate(265, 20)">
    <rect width="515" height="260" rx="10" fill="#020617" stroke="#334155" stroke-width="1"/>
    <!-- Video stream background placeholder -->
    <rect x="20" y="20" width="310" height="220" rx="8" fill="#1E293B"/>
    <circle cx="175" cy="115" r="40" fill="#334155"/>
    <path d="M 145 155 Q 175 135 205 155 Z" fill="#475569"/>
    <rect x="32" y="32" width="90" height="22" rx="4" fill="#000000" opacity="0.6"/>
    <text x="77" y="47" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#4ADE80" text-anchor="middle">● LIVE 1080P HD</text>

    <!-- Side Consultation Notes -->
    <rect x="345" y="20" width="150" height="220" rx="8" fill="#0F172A"/>
    <text x="357" y="42" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">CLINICAL OBSERVATION</text>
    <text x="357" y="65" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• Patient reports mild</text>
    <text x="357" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">  respiratory fatigue</text>
    <text x="357" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• ECG sinus rhythm normal</text>
    <text x="357" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">• No acute chest pressure</text>

    <rect x="355" y="195" width="130" height="32" rx="4" fill="#10B981"/>
    <text x="420" y="215" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Save to Cerner EHR</text>
  </g>

  <!-- Bottom Timeline & Lab Tests -->
  <g transform="translate(265, 295)">
    <rect width="515" height="135" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">LONGITUDINAL HEALTH RECORD &amp; LAB BIOMARKERS</text>
    
    <g transform="translate(20, 42)">
      <rect width="150" height="75" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">HbA1c Glucose</text>
      <text x="14" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#10B981">5.4%</text>
      <text x="14" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Normal &lt; 5.7%</text>
    </g>
    <g transform="translate(182, 42)">
      <rect width="150" height="75" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Cholesterol HDL</text>
      <text x="14" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#3B82F6">58 mg/dL</text>
      <text x="14" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Optimal Range</text>
    </g>
    <g transform="translate(345, 42)">
      <rect width="150" height="75" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">eGFR Kidney Func</text>
      <text x="14" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#8B5CF6">94 mL/min</text>
      <text x="14" y="62" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Stage 1 Normal</text>
    </g>
  </g>
</svg>