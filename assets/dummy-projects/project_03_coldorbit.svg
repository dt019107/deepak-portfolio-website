<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#090E17"/>
  <!-- Map Grid background -->
  <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200 M 0 250 L 800 250 M 0 300 L 800 300 M 0 350 L 800 350 M 0 400 L 800 400" stroke="#141E33" stroke-width="1"/>
  <path d="M 100 0 L 100 450 M 200 0 L 200 450 M 300 0 L 300 450 M 400 0 L 400 450 M 500 0 L 500 450 M 600 0 L 600 450 M 700 0 L 700 450" stroke="#141E33" stroke-width="1"/>

  <!-- Route Line -->
  <path d="M 120 320 Q 280 180 440 240 T 680 120" fill="none" stroke="#0284C7" stroke-width="3" stroke-dasharray="8,4"/>
  <circle cx="120" cy="320" r="7" fill="#38BDF8"/>
  <text x="120" y="344" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38BDF8" text-anchor="middle">MUMBAI DEPOT</text>
  <circle cx="440" cy="240" r="5" fill="#38BDF8"/>
  <circle cx="680" cy="120" r="8" fill="#10B981"/>
  <text x="680" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34D399" text-anchor="middle">DELHI COLD STORAGE</text>

  <!-- Live Vehicle Pin -->
  <g transform="translate(420, 210)">
    <circle cx="20" cy="20" r="16" fill="#0284C7" opacity="0.3"/>
    <circle cx="20" cy="20" r="8" fill="#38BDF8"/>
    <rect x="-40" y="-35" width="120" height="28" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="20" y="-17" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TRUCK MH-04-9122</text>
  </g>

  <!-- Top Telemetry Bar -->
  <g transform="translate(30, 20)">
    <rect width="740" height="60" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="20" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">FLEET TRANSIT TELEMETRY</text>
    <rect x="250" y="18" width="140" height="26" rx="4" fill="#14532D"/>
    <text x="320" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4ADE80" text-anchor="middle">STATUS: OPTIMAL</text>
    
    <text x="440" y="35" font-family="monospace" font-size="13" fill="#94A3B8">TEMP: <tspan font-weight="bold" fill="#38BDF8">-18.4°C</tspan></text>
    <text x="580" y="35" font-family="monospace" font-size="13" fill="#94A3B8">HUMIDITY: <tspan font-weight="bold" fill="#38BDF8">44%</tspan></text>
    <text x="700" y="35" font-family="monospace" font-size="11" fill="#4ADE80">14 ACTIVE</text>
  </g>

  <!-- Bottom Telemetry Card Grid -->
  <g transform="translate(30, 310)">
    <rect width="230" height="110" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">CHAMBER 1 (COVID VACCINES)</text>
    <text x="16" y="58" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#38BDF8">-20.2°C</text>
    <text x="16" y="85" font-family="system-ui, sans-serif" font-size="10" fill="#34D399">✓ Excursion Tolerance: ±0.4°C</text>
  </g>
  <g transform="translate(285, 310)">
    <rect width="230" height="110" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">CHAMBER 2 (INSULIN GLARGINE)</text>
    <text x="16" y="58" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#A855F7">+3.8°C</text>
    <text x="16" y="85" font-family="system-ui, sans-serif" font-size="10" fill="#34D399">✓ 2°C to 8°C Cold Chain Intact</text>
  </g>
  <g transform="translate(540, 310)">
    <rect width="230" height="110" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">SATELLITE DOWNLINK &amp; BATTERY</text>
    <text x="16" y="58" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#10B981">99.8%</text>
    <text x="16" y="85" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">NavIC + Iridium Dual Telemetry</text>
  </g>
</svg>